<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi pedido · The Bakery Side</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/tienda.css">
<style>
  .track { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; padding-block: 28px 60px; }
  .big { font-family: var(--display); font-size: 64px; line-height: 1; letter-spacing: .03em; }
  .steps { list-style: none; margin: 8px 0 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; padding-bottom: 18px; position: relative; }
  .steps li::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
  .steps li:last-child::before { display: none; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); position: relative; z-index: 1; }
  .steps li.done .dot { background: var(--tostado); border-color: var(--tostado); }
  .steps li.done::before { background: var(--tostado); }
  .steps li.now .dot { border-color: var(--tostado); box-shadow: 0 0 0 5px rgb(198 138 78 / .2); }
  .steps small { display: block; color: var(--text-2); }
  .steps .t { color: var(--text-2); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .paytabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .paytabs button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 7px 16px; font-weight: 600; cursor: pointer; }
  .paytabs button[aria-selected="true"] { background: var(--inverse); color: var(--on-inverse); border-color: var(--inverse); }
  .qrbox { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: start; }
  .qrbox img { width: 220px; height: 220px; object-fit: contain; border-radius: 12px; border: 1px solid var(--line); background: #fff; padding: 6px; }
  .paybox { display: grid; gap: 12px; margin-top: 14px; }
  .payseg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
  .payseg button { border: 0; background: transparent; border-radius: 9px; padding: 10px 8px; font-weight: 600; font-size: 14px; color: var(--text-2); cursor: pointer; line-height: 1.2; }
  .payseg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgb(0 0 0 / .12); }
  .paysteps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .paysteps > li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 20px; }
  .paysteps > li:last-child { padding-bottom: 0; }
  .paysteps > li::before { content: ""; position: absolute; left: 14px; top: 32px; bottom: 4px; width: 2px; background: var(--line); }
  .paysteps > li:last-child::before { display: none; }
  .pn { width: 30px; height: 30px; border-radius: 50%; background: var(--inverse); color: var(--on-inverse); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .pbody { display: grid; gap: 10px; padding-top: 4px; min-width: 0; }
  .pbody > b { font-size: 16px; }
  .drop { display: block; border: 2px dashed var(--tostado); border-radius: 14px; background: rgb(198 138 78 / .07); padding: 18px 14px; cursor: pointer; text-align: center; }
  .drop.has { border-style: solid; text-align: left; padding: 10px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop:focus-within { outline: 3px solid rgb(198 138 78 / .4); outline-offset: 2px; }
  .drop-empty { display: grid; justify-items: center; gap: 4px; color: var(--text); }
  .drop-empty svg { color: var(--tostado); }
  .drop-empty small, .drop-full small { color: var(--text-2); font-size: 13px; }
  .drop-full { display: flex; gap: 12px; align-items: center; }
  .drop-full img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .drop-full span { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
  .pinbox { margin-top: 16px; border: 2px solid var(--tostado); border-radius: 14px; padding: 14px; display: grid; gap: 6px; justify-items: center; text-align: center; background: rgb(198 138 78 / .06); }
  .pinbox .lbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); font-weight: 700; }
  .pinnum { display: flex; gap: 8px; }
  .pinnum i { font-style: normal; font-family: var(--display); font-size: 40px; line-height: 1; width: 44px; padding: 8px 0 4px; background: var(--surface-2); border-radius: 10px; }
  .pinbox small { color: var(--text-2); font-size: 13.5px; max-width: 380px; }
  @media (max-width: 520px) { .qrbox { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
</style>
</head>
<body class="light">
<header class="topbar"><div class="wrap"><a class="brand logo" href="/" aria-label="The Bakery Side, inicio"><img src="/assets/brand/tbs-tinta.svg" alt="The Bakery Side" width="84" height="45"></a><a class="btn small ghost" href="/">Hacer otro pedido</a></div></header>
<main class="wrap">
  <div class="track" id="root"><p class="muted">Cargando tu pedido…</p></div>
</main>

<div class="modal" id="payModal" hidden role="dialog" aria-modal="true" aria-labelledby="payTitle">
  <div class="modal-card">
    <div class="cart-head"><h2 id="payTitle" class="display">Pagar pedido</h2><button class="btn ghost small" type="button" id="closePay">Cerrar</button></div>
    <p class="muted small" id="payInfo"></p>
    <div id="pp-button"></div>
  </div>
</div>

<script type="module" src="/assets/pedido.js"></script>
</body>
</html>
